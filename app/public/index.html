<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PR Lab · 战舰世界个人评级查询</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9A%93%3C/text%3E%3C/svg%3E" />`n<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand"><span class="dot"></span><b>PR LAB</b> · World of Warships</div>
    <div class="meta">
      <span id="m-sample">样本加载中…</span>
      <span>ASIA</span>
      <span>v0.1</span>
    </div>
  </div>

  <div class="hero">
    <h1><em>PR</em> 计算器</h1>

    <div class="search">
      <input id="q" placeholder="游戏昵称或 account_id，例如 JiangYi_HuaiXi" autocomplete="off" spellcheck="false" />
      <button id="go">查询</button>
    </div>
    <div class="examples">
      <span>试试：</span>
      <button data-q="JiangYi_HuaiXi">JiangYi_HuaiXi</button>
      <button data-q="Reloading_Kawakaze_FOX">Reloading_Kawakaze_FOX</button>
    </div>
  </div>

  <div id="out"></div>

  <footer>
    <div>数据：Wargaming 官方 API · 基准：第三方公开基准表 · 评分模型：本项目的设计稿实现</div>
    <div id="m-time"></div>
  </footer>
</div>

<script src="/app.js"></script>
</body>
</html>
